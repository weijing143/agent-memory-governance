name: Bug Report
 description: Report a bug in scripts, documentation, or diagrams
 title: "[Bug] "
 labels: ["bug"]
 body:
   - type: markdown
     attributes:
       value: |
         Thank you for reporting a bug. Please fill in the details below.
   - type: textarea
     id: description
     attributes:
       label: Description
       description: What went wrong?
     validations:
       required: true
   - type: textarea
     id: reproduce
     attributes:
       label: Steps to Reproduce
       description: Provide commands or a minimal example.
     validations:
       required: true
   - type: input
     id: version
     attributes:
       label: Version
       description: Version or commit SHA you are using.
   - type: input
     id: platform
     attributes:
       label: Platform
       description: Hermes, OpenClaw, or other runtime.
   - type: textarea
     id: expected
     attributes:
       label: Expected Behavior
